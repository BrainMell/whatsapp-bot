name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - audit/fix-pass-1


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/local/go/bin
            cd ~/whatsapp-bot

            # ── BACKUP AUTH FILES ────────────────────────────────────────
            AUTH_BACKUP=/tmp/auth_backup_$(date +%s).tar.gz
            if [ -d "instances/Jake/auth" ]; then
              tar czf "$AUTH_BACKUP" instances/*/auth/ 2>/dev/null || true
              echo "Backed up auth files to $AUTH_BACKUP"
            fi

            # ── FORCE-UPDATE CODE ────────────────────────────────────────
            git fetch origin
            git reset --hard "origin/${{ github.ref_name }}"
            echo "Code updated to $(git rev-parse --short HEAD)"

            # ── RESTORE AUTH FILES ───────────────────────────────────────
            if [ -f "$AUTH_BACKUP" ]; then
              tar xzf "$AUTH_BACKUP"
              rm "$AUTH_BACKUP"
              echo "Restored auth files"
            fi

            npm install
            pm2 restart whatsapp-bot

            # ── VERIFY ───────────────────────────────────────────────────
            echo "=============================================="
            echo "=== DEPLOY VERIFICATION ==="
            echo "Deployed HEAD: $(git rev-parse --short HEAD)"
            echo "Deployed commit: $(git log -1 --format='%s')"

            # ── DIAGNOSTICS (wait for bot to boot, then dump state) ──────
            echo "=== Waiting 20s for bot to boot ==="
            sleep 20

            echo "=== NODE VERSION ==="
            node --version

            echo "=== AUTH FILES (proof they're on the server) ==="
            echo "Auth dir exists: $(test -d instances/Jake/auth && echo YES || echo NO)"
            echo "Auth file count: $(ls instances/Jake/auth/ 2>/dev/null | wc -l)"
            ls -la instances/Jake/auth/creds.json 2>&1
            ls -la instances/Jake/auth/ 2>&1 | head -10

            echo "=== BANNER FILE ==="
            ls -la instances/Jake/assets/banner.png 2>&1
            file instances/Jake/assets/banner.png 2>&1
            echo "Banner size: $(wc -c < instances/Jake/assets/banner.png 2>/dev/null) bytes"

            echo "=== SHARP CHECK ==="
            node -e "try { const s = require('sharp'); s({create:{width:1,height:1,channels:3,background:{r:255,g:255,b:255}}}).jpeg().toBuffer().then(b => console.log('sharp WORKS, test buffer:', b.length, 'bytes')).catch(e => console.log('sharp PROCESS FAIL:', e.message)); } catch(e) { console.log('sharp LOAD FAIL:', e.message); }" 2>&1

            echo "=== JIMP CHECK ==="
            node -e "try { const j = require('jimp'); console.log('jimp loads OK, Jimp type:', typeof j.Jimp); } catch(e) { console.log('jimp FAIL:', e.message); }" 2>&1

            echo "=== SHARP NATIVE BINARY CHECK ==="
            ls -la node_modules/@img/sharp-linux-x64/ 2>&1 | head -5
            ls -la node_modules/@img/sharp-libvips-linux-x64/ 2>&1 | head -5

            echo "=== SYNTAX CHECK ==="
            node -c core/engine.js 2>&1 && echo "engine.js syntax OK" || echo "engine.js SYNTAX ERROR"

            echo "=== PM2 STATUS ==="
            pm2 list 2>&1

            echo "=== PM2 LOGS (last 200 lines, combined out+err) ==="
            pm2 logs whatsapp-bot --lines 200 --nostream 2>&1 | tail -200

            echo "=============================================="
            echo "✅ Diagnostics complete."
