name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - audit/fix-pass-1

# Every push may restart all tenants. Cancel older runs so only the newest
# fully-checked audit commit is deployed.
concurrency:
  group: deploy-audit-fix-pass-1
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4

      - name: Set up Node for pre-deploy checks
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax and regression preflight
        run: |
          set -e
          node --check core/games/murdermystery/index.js
          node --check core/games/murdermystery/halloweenCards.js
          node --check core/rpg/guildAdventure.js
          node --check core/rpg/abyssScene.js
          node --check core/rpg/interior3d/scene.js
          node --check core/rpg/interior3d/index.js
          node --check core/rpg/homesteadRenderer.js
          node --check core/rpg/partyDungeonRank.js
          node --check scripts/qa_party_dungeon_rank.js
          node --check scripts/qa_homestead_glb.js
          node --check scripts/abyss_visual_qa.js
          node scripts/qa_party_dungeon_rank.js
          node scripts/qa_homestead_glb.js
          node scripts/qa_facing_contract.js

      - name: SSH and Deploy (smart auth precedence)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd ~/whatsapp-bot
            git fetch --force --prune origin || exit 1
            git show "origin/${{ github.ref_name }}:scripts/deploy_on_box.sh" > /tmp/deploy_on_box.sh \
              && bash /tmp/deploy_on_box.sh "${{ github.ref_name }}"
