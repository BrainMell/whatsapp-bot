name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - audit/fix-pass-1


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/local/go/bin
            cd ~/whatsapp-bot

            # ── DUMP EXISTING PM2 LOGS BEFORE RESTART ────────────────────
            # PM2 log files persist across restarts. Dump them NOW so we
            # can see what happened when the user sent commands before
            # this deploy. Grep for relevant keywords.
            echo "=============================================="
            echo "=== PRE-RESTART PM2 LOGS (last 500 lines) ==="
            echo "=== OUT LOG (last 500 lines) ==="
            tail -500 ~/.pm2/logs/whatsapp-bot-out.log 2>&1 | tail -500
            echo "=== ERR LOG (last 500 lines) ==="
            tail -500 ~/.pm2/logs/whatsapp-bot-error.log 2>&1 | tail -500
            echo "=== GREP: Skipping message / Pipeline:4 / sendMenuWithBanner / diag / CMD DETECTED ==="
            grep -E "Skipping message|Pipeline:4|sendMenuWithBanner|diag|CMD DETECTED|Dropping invalid|Banner image send failed|IMAGE SEND FAILED|IMAGE SENT OK" ~/.pm2/logs/whatsapp-bot-out.log 2>&1 | tail -100
            grep -E "Skipping message|Pipeline:4|sendMenuWithBanner|diag|CMD DETECTED|Dropping invalid|Banner image send failed|IMAGE SEND FAILED|IMAGE SENT OK" ~/.pm2/logs/whatsapp-bot-error.log 2>&1 | tail -100
            echo "=============================================="

            # ── BACKUP AUTH FILES ────────────────────────────────────────
            AUTH_BACKUP=/tmp/auth_backup_$(date +%s).tar.gz
            if [ -d "instances/Jake/auth" ]; then
              tar czf "$AUTH_BACKUP" instances/*/auth/ 2>/dev/null || true
              echo "Backed up auth files to $AUTH_BACKUP"
            fi

            # ── FORCE-UPDATE CODE ────────────────────────────────────────
            git fetch origin
            git reset --hard "origin/${{ github.ref_name }}"
            echo "Code updated to $(git rev-parse --short HEAD)"

            # ── RESTORE AUTH FILES ───────────────────────────────────────
            if [ -f "$AUTH_BACKUP" ]; then
              tar xzf "$AUTH_BACKUP"
              rm "$AUTH_BACKUP"
              echo "Restored auth files"
            fi

            npm install
            pm2 restart whatsapp-bot

            # ── VERIFY ───────────────────────────────────────────────────
            echo "=============================================="
            echo "=== DEPLOY VERIFICATION ==="
            echo "Deployed HEAD: $(git rev-parse --short HEAD)"
            echo "Deployed commit: $(git log -1 --format='%s')"

            echo "=== Waiting 20s for bot to boot ==="
            sleep 20

            echo "=== AUTH FILES ==="
            echo "Auth dir exists: $(test -d instances/Jake/auth && echo YES || echo NO)"
            echo "Auth file count: $(ls instances/Jake/auth/ 2>/dev/null | wc -l)"

            echo "=== SHARP CHECK ==="
            node -e "try { const s = require('sharp'); s({create:{width:1,height:1,channels:3,background:{r:255,g:255,b:255}}}).jpeg().toBuffer().then(b => console.log('sharp WORKS, test buffer:', b.length, 'bytes')).catch(e => console.log('sharp PROCESS FAIL:', e.message)); } catch(e) { console.log('sharp LOAD FAIL:', e.message); }" 2>&1

            echo "=== MEDIA UPLOAD CONNECTIVITY TEST ==="
            echo "--- DNS resolution of mmg.whatsapp.net ---"
            node -e "const dns = require('dns'); dns.lookup('mmg.whatsapp.net', { all: true }, (err, addrs) => { if (err) console.log('DNS FAIL:', err.message); else console.log('DNS OK:', JSON.stringify(addrs)); });"
            echo "--- DNS resolution of mmg.whatsapp.net (IPv4 only) ---"
            node -e "const dns = require('dns'); dns.lookup('mmg.whatsapp.net', { family: 4 }, (err, addr) => { if (err) console.log('IPv4 DNS FAIL:', err.message); else console.log('IPv4 DNS OK:', addr); });"
            echo "--- DNS resolution of mmg.whatsapp.net (IPv6 only) ---"
            node -e "const dns = require('dns'); dns.lookup('mmg.whatsapp.net', { family: 6 }, (err, addr) => { if (err) console.log('IPv6 DNS FAIL:', err.message); else console.log('IPv6 DNS OK:', addr); });"
            echo "--- HTTPS connectivity test (IPv4 forced, 10s timeout) ---"
            node -e "
              const https = require('https');
              const agent = new https.Agent({ family: 4 });
              const req = https.get('https://mmg.whatsapp.net/', { agent, timeout: 10000 }, (res) => {
                console.log('IPv4 HTTPS OK: status', res.statusCode);
                res.resume();
              });
              req.on('error', (e) => console.log('IPv4 HTTPS FAIL:', e.message));
              req.on('timeout', () => { console.log('IPv4 HTTPS TIMEOUT (10s)'); req.destroy(); });
            "
            echo "--- HTTPS connectivity test (default, 10s timeout) ---"
            node -e "
              const https = require('https');
              const req = https.get('https://mmg.whatsapp.net/', { timeout: 10000 }, (res) => {
                console.log('Default HTTPS OK: status', res.statusCode);
                res.resume();
              });
              req.on('error', (e) => console.log('Default HTTPS FAIL:', e.message));
              req.on('timeout', () => { console.log('Default HTTPS TIMEOUT (10s)'); req.destroy(); });
            "
            echo "--- IPv6 check on this server ---"
            ip -6 addr show 2>&1 | head -10 || echo "No IPv6 addresses"

            echo "=== SYNTAX CHECK ==="
            node -c core/engine.js 2>&1 && echo "engine.js syntax OK" || echo "engine.js SYNTAX ERROR"

            echo "=== PM2 STATUS ==="
            pm2 list 2>&1

            echo "=== POST-RESTART PM2 LOGS (last 100 lines) ==="
            pm2 logs whatsapp-bot --lines 100 --nostream 2>&1 | tail -100

            echo "=============================================="
            echo "✅ Diagnostics complete."
